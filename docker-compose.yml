services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: smartup
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: smartup
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  etl:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: postgresql://postgres:smartup@postgres:5432/smartup
    volumes:
      - ./auth.json:/app/auth.json:ro
      - ./CleanedData:/app/CleanedData
    restart: "no"

volumes:
  postgres_data:
